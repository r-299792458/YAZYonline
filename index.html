<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>YAZY Online</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #1b1b1b;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== ヘッダー ===== */
        header {
            height: 56px;
            background: #242424;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .user {
            color: #4fa7ff;
            font-size: 0.95rem;
        }

        .logout {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* ===== メイン ===== */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 1.8rem;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        .startBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            background: #3a8dde;
            color: white;
            cursor: pointer;
        }

        /* ===== フッター ===== */
        footer {
            height: 56px;
            background: #242424;
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 0.95rem;
        }

        footer button {
            background: none;
            border: none;
            color: #bbbbbb;
            cursor: pointer;
        }

        /* ===== プロフィールモーダル ===== */
        #profileOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #profileModal {
            background: #242424;
            width: 90%;
            max-width: 320px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 0.2s ease;
        }

        .modalHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 1px solid #333;
            font-size: 1.05rem;
        }

        .modalHeader button {
            background: none;
            border: none;
            color: #bbb;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .modalContent {
            padding: 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }

        /* ===== 設定モーダル ===== */
        #settingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #settingModal {
            background: #242424;
            width: 92%;
            max-width: 360px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 0.2s ease;
        }

        .settingSection {
            margin-bottom: 18px;
        }

        .settingSection h3 {
            margin: 0 0 8px;
            font-size: 0.95rem;
            color: #4fa7ff;
        }

        .settingItem {
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: #fff;
            text-align: left;
            cursor: pointer;
        }

        .settingItem:hover {
            background: #3d3d3d;
        }

        .settingNote {
            font-size: 0.85rem;
            color: #888;
            padding-left: 4px;
        }

        .danger h3 {
            color: #ff6b6b;
        }

        .dangerBtn {
            background: #402020;
            color: #ff6b6b;
        }

        /* ===== ニックネームモーダル ===== */
        #nicknameOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #nicknameModal {
            background: #242424;
            width: 90%;
            max-width: 320px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 0.2s ease;
        }

        /* ===== メール変更モーダル ===== */
        #emailOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        #emailModal {
            background: #242424;
            width: 90%;
            max-width: 320px;
            border-radius: 14px;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 0.2s ease;
        }

    </style>
</head>

<body>

<header>
    <div class="user" id="userEmail">Loading...</div>
    <button class="logout" id="logoutBtn">ログアウト</button>
</header>

<main>
    <div class="container">
        <h1>YAZY Online</h1>

        <input
            type="text"
            placeholder="部屋番号（任意）"
            maxlength="10"
        >

        <button class="startBtn">▶ ゲーム開始</button>
    </div>
</main>

<footer>
    <button>🥇 ランキング</button>
    <button>🏆 実績</button>
    <button id="openSetting">⚙ 設定</button>
</footer>

<div id="profileOverlay" style="display:none;">
    <div id="profileModal">
        <div class="modalHeader">
            <span>プロフィール</span>
            <button id="closeProfile">✕</button>
        </div>

        <div class="modalContent">
            <p><strong>メール：</strong><span id="profileEmail"></span></p>
            <p><strong>ニックネーム：</strong><span id="profileNickname">未設定</span></p>
            <p><strong>レベル：</strong>1</p>
            <p><strong>レート：</strong>0</p>
            <p><strong>実績：</strong>0 / 10</p>
        </div>
    </div>
</div>

<div id="settingOverlay" style="display:none;">
    <div id="settingModal">
        <div class="modalHeader">
            <span>設定</span>
            <button id="closeSetting">✕</button>
        </div>

        <div class="modalContent">

            <div class="settingSection">
                <h3>アカウント設定</h3>
                <button class="settingItem" id="openNickname">ニックネーム変更</button>
                <button class="settingItem" id="openEmail">メールアドレス変更</button>
                <button class="settingItem" id="openPassword">パスワード変更</button>
            </div>

            <div class="settingSection">
                <h3>ゲーム設定</h3>
                <p class="settingNote">準備中</p>
            </div>

            <div class="settingSection">
                <h3>表示 / 操作</h3>
                <p class="settingNote">準備中</p>
            </div>

            <div class="settingSection danger">
                <h3>システム</h3>
                <button class="settingItem dangerBtn">データ削除</button>
            </div>

        </div>
    </div>
</div>

<div id="nicknameOverlay" style="display:none;">
    <div id="nicknameModal">
        <div class="modalHeader">
            <span>ニックネーム変更</span>
            <button id="closeNickname">✕</button>
        </div>

        <div class="modalContent">
            <input id="nicknameInput" type="text" placeholder="新しいニックネーム">
            <button class="startBtn" id="saveNickname">保存</button>
            <p id="nicknameMsg"></p>
        </div>
    </div>
</div>

<div id="emailOverlay" style="display:none;">
    <div id="emailModal">
        <div class="modalHeader">
            <span>メールアドレス変更</span>
            <button id="closeEmail">✕</button>
        </div>

        <div class="modalContent">
            <input id="emailInput" type="email" placeholder="新しいメールアドレス">
            <button class="startBtn" id="saveEmail">変更する</button>
            <p id="emailMsg"></p>
        </div>
    </div>
</div>

<script type="module">
import { supabase } from "./supabase.js";

/* =========================
   ログインガード
========================= */
const { data, error } = await supabase.auth.getSession();

if (error || !data.session) {
    window.location.replace("login.html");
    throw new Error("No session");
}

const session = data.session;
    
/* =========================
   プロフィール取得
========================= */
const { data: profile } = await supabase
    .from("profiles")
    .select("nickname")
    .eq("id", session.user.id)
    .single();

// 表示名決定（ニックネーム優先）
const displayName = profile?.nickname || session.user.email;
    
// ヘッダー表示
document.getElementById("userEmail").textContent = "👤 " + displayName;

/* =========================
   セッション監視
========================= */
supabase.auth.onAuthStateChange((event, session) => {
    if (!session) {
        window.location.href = "login.html";
    }
});

/* =========================
   ログアウト
========================= */
document.getElementById("logoutBtn").addEventListener("click", async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
});

/* =========================
   プロフィールモーダル
========================= */
const profileOverlay = document.getElementById("profileOverlay");
const profileEmail = document.getElementById("profileEmail");
const closeProfile = document.getElementById("closeProfile");

// ヘッダーのユーザー名をクリック
document.getElementById("userEmail").addEventListener("click", () => {
    profileEmail.textContent = session.user.email;
    profileOverlay.style.display = "flex";
});

// 閉じるボタン
closeProfile.addEventListener("click", () => {
    profileOverlay.style.display = "none";
});

// 背景クリックで閉じる
profileOverlay.addEventListener("click", (e) => {
    if (e.target === profileOverlay) {
        profileOverlay.style.display = "none";
    }
});

/* =========================
   設定モーダル
========================= */
const settingOverlay = document.getElementById("settingOverlay");
const closeSetting = document.getElementById("closeSetting");

// フッターの設定ボタン
document.getElementById("openSetting")
    .addEventListener("click", () => {
        settingOverlay.style.display = "flex";
    });

// 閉じる
closeSetting.addEventListener("click", () => {
    settingOverlay.style.display = "none";
});

settingOverlay.addEventListener("click", (e) => {
    if (e.target === settingOverlay) {
        settingOverlay.style.display = "none";
    }
});

/* =========================
   ニックネーム
========================= */
const profileNickname = document.getElementById("profileNickname");

profileNickname.textContent =
    profile?.nickname || "未設定";

const openNickname = document.getElementById("openNickname");
const nicknameOverlay = document.getElementById("nicknameOverlay");
const closeNickname = document.getElementById("closeNickname");
const saveNickname = document.getElementById("saveNickname");

openNickname.addEventListener("click", () => {
    const input = document.getElementById("nicknameInput");
    const msg = document.getElementById("nicknameMsg");
    input.value = profile?.nickname || "";
    msg.textContent = "";
    msg.className = "";
    nicknameOverlay.style.display = "flex";
});

closeNickname.addEventListener("click", () => {
    nicknameOverlay.style.display = "none";
});

saveNickname.addEventListener("click", async () => {
    const newName = document.getElementById("nicknameInput").value.trim();
    const msg = document.getElementById("nicknameMsg");

    if (!newName) {
        msg.textContent = "ニックネームを入力してください";
        msg.className = "error";
        return;
    }

    const { error } = await supabase
        .from("profiles")
        .upsert({
            id: session.user.id,
            nickname: newName
        });

    const { error: authError } = await supabase
        .auth
        .updateUser({
            data: {
                full_name: newName
            }
        });
    if (authError) {
        console.warn("Auth側のディスプレイネーム更新に失敗:",authError.message);
    }

    if (error) {
        msg.textContent = "保存に失敗しました";
        msg.className = "error";
        return;
    }

    // 即時反映
    profile.nickname = newName;
    document.getElementById("userEmail").textContent = "👤 " + newName;
    profileNickname.textContent = newName;

    msg.textContent = "保存しました";
    msg.className = "success";

    setTimeout(() => {
        nicknameOverlay.style.display = "none";
    }, 800);
});

nicknameOverlay.addEventListener("click", (e) => {
    if (e.target === nicknameOverlay) {
        nicknameOverlay.style.display = "none";
    }
});

/* =========================
   メールアドレス
========================= */
const openEmail = document.getElementById("openEmail");
const emailOverlay = document.getElementById("emailOverlay");
const closeEmail = document.getElementById("closeEmail");
const saveEmail = document.getElementById("saveEmail");

openEmail.addEventListener("click", () => {
    const input = document.getElementById("emailInput");
    const msg = document.getElementById("emailMsg");
    input.value = "";
    msg.textContent = "";
    msg.className = "";
    emailOverlay.style.display = "flex";
});

closeEmail.addEventListener("click", () => {
    emailOverlay.style.display = "none";
});

emailOverlay.addEventListener("click", (e) => {
    if (e.target === emailOverlay) {
        emailOverlay.style.display = "none";
    }
});

saveEmail.addEventListener("click", async () => {
    const newEmail = document.getElementById("emailInput").value.trim();
    const msg = document.getElementById("emailMsg");

    if (!newEmail) {
        msg.textContent = "メールアドレスを入力してください";
        msg.className = "error";
        return;
    }

    const { error } = await supabase.auth.updateUser({
        email: newEmail
    });

    if (error) {
        msg.textContent = "変更に失敗しました";
        msg.className = "error";
        return;
    }

    msg.textContent =
        "確認メールを送信しました。メール内のリンクを確認してください。";
    msg.className = "success";
});

/* =========================
   パスワード1
========================= */
const openPassword = document.getElementById("openPassword");

openPassword.addEventListener("click", () => {
    window.location.href = "update_password.html";
});
</script>
</body>
</html>
